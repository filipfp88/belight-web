<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" role="img" aria-label="BE-LIGHT logo">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&amp;family=DM+Sans:wght@300&amp;display=swap');
    </style>
  </defs>

  <!-- Text: BE -->
  <text
    x="0"
    y="38"
    font-family="'Cormorant Garamond', serif"
    font-weight="300"
    font-size="29.6"
    letter-spacing="1.18"
    fill="#ffffff"
    dominant-baseline="auto"
  >BE</text>

  <!-- ICON – centered at x=110, y=20 (32×32 viewBox mapped to 36×36 at this position) -->
  <!-- Scale factor: 36/32 = 1.125, offset: x=92, y=2 -->
  <g transform="translate(92, 2) scale(1.125)">
    <!-- Upper ray -->
    <line x1="16" y1="2" x2="16" y2="9" stroke="hsl(38,91%,55%)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Upper diagonal left -->
    <line x1="8"  y1="4"  x2="13" y2="11" stroke="hsl(38,91%,55%)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Upper diagonal right -->
    <line x1="24" y1="4"  x2="19" y2="11" stroke="hsl(38,91%,55%)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Left horizontal ray -->
    <line x1="2"  y1="16" x2="9"  y2="16" stroke="hsl(38,91%,55%)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    <!-- Right horizontal ray -->
    <line x1="23" y1="16" x2="30" y2="16" stroke="hsl(38,91%,55%)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    <!-- Outer circle -->
    <circle cx="16" cy="16" r="4.5" stroke="hsl(38,91%,55%)" stroke-width="1.2" fill="none"/>
    <!-- Inner dot -->
    <circle cx="16" cy="16" r="2" fill="hsl(38,91%,55%)" opacity="0.6"/>
  </g>

  <!-- Text: LIGHT -->
  <text
    x="140"
    y="38"
    font-family="'Cormorant Garamond', serif"
    font-weight="300"
    font-size="29.6"
    letter-spacing="1.18"
    fill="#ffffff"
    dominant-baseline="auto"
  >LIGHT</text>

  <!-- Tagline -->
  <text
    x="140"
    y="54"
    font-family="'DM Sans', sans-serif"
    font-weight="300"
    font-size="11.5"
    letter-spacing="3.68"
    fill="#666666"
    text-anchor="middle"
    dominant-baseline="auto"
  >LIGHTING SOLUTIONS</text>
</svg>
