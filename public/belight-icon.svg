<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="BE-LIGHT icon">
  <!-- Upper ray (100% opacity) -->
  <line x1="16" y1="2" x2="16" y2="9" stroke="#F5A824" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Upper diagonal left (70% opacity) -->
  <line x1="8"  y1="4"  x2="13" y2="11" stroke="#F5A824" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Upper diagonal right (70% opacity) -->
  <line x1="24" y1="4"  x2="19" y2="11" stroke="#F5A824" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Left horizontal ray (85% opacity) -->
  <line x1="2"  y1="16" x2="9"  y2="16" stroke="#F5A824" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Right horizontal ray (85% opacity) -->
  <line x1="23" y1="16" x2="30" y2="16" stroke="#F5A824" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Outer circle (stroke only) -->
  <circle cx="16" cy="16" r="4.5" stroke="#F5A824" stroke-width="1.2" fill="none"/>
  <!-- Inner dot (60% opacity) -->
  <circle cx="16" cy="16" r="2" fill="#F5A824" opacity="0.6"/>
</svg>
